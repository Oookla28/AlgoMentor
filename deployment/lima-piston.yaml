# Dedicated Linux VM for the official Piston/Isolate execution service.
# Source image and SHA-256: Lima v2.2.1 templates/_images/ubuntu-24.04.yaml.
# No base templates: Docker templates otherwise inherit a host home mount.
minimumLimaVersion: 2.2.1
vmType: vz
arch: aarch64
cpus: 2
memory: 3GiB
disk: 12GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55
mounts: []
mountType: virtiofs
containerd:
  system: false
  user: false
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
env: {}
propagateProxyEnv: false
portForwards:
  - guestPort: 2000
    guestIP: 127.0.0.1
    hostPort: 2000
    hostIP: 127.0.0.1
    proto: tcp
  - guestIP: 0.0.0.0
    proto: any
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eu -o pipefail
      if ! command -v docker >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends docker.io
      fi
      systemctl enable --now docker.service
      test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
      docker info | grep -Eq 'Cgroup Version: +2$'
probes:
  - script: |
      #!/bin/bash
      set -eu -o pipefail
      test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
      sudo docker info >/dev/null
      sudo docker info | grep -Eq 'Cgroup Version: +2$'
    hint: See /var/log/cloud-init-output.log inside this dedicated VM.
message: |
  AlgoMentor isolated execution VM is ready.
  No host home, project, database, credentials, SSH agent or Docker socket is shared.
  The Piston API is forwarded only to 127.0.0.1:2000.
